<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bhuvia Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}button,input,select,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#eef7f3}.card{background:#fff;border:1px solid #e4e8ee;border-radius:16px;box-shadow:0 10px 35px #0001}.login-card{width:min(430px,100%);padding:28px}.logo{width:58px;height:58px;object-fit:contain;border-radius:12px}.muted{color:#687386}.small{font-size:13px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d5dce5;border-radius:9px;background:#fff}textarea{min-height:90px}.primary{border:0;background:#0b9b6b;color:white;border-radius:9px;padding:11px 15px;font-weight:700}.full{width:100%;margin-top:16px}.secondary{border:1px solid #d5dce5;background:#fff;border-radius:9px;padding:9px 13px}.error{color:#b42318}.success{color:#087f5b}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:235px;background:#10261f;color:white;padding:18px 12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;padding:8px}.brand img{width:38px;height:38px;border-radius:8px;object-fit:contain;background:#fff}.nav{margin-top:20px}.nav button{width:100%;border:0;background:transparent;color:#dce8e3;text-align:left;padding:12px;border-radius:8px;margin:2px 0}.nav button.active,.nav button:hover{background:#1c4638;color:white}.logout{position:absolute;left:12px;right:12px;bottom:18px}.main{margin-left:235px;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top button{margin-left:7px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:18px}.num{font-size:27px;font-weight:800;margin-top:7px}.panel{padding:18px;margin-top:16px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.toolbar input{max-width:320px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f3;font-size:14px}th{font-size:12px;color:#687386;text-transform:uppercase}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#e9f7f1;color:#087f5b;font-size:12px;font-weight:700}.orange{background:#fff5df;color:#995c00}.red{background:#ffeded;color:#b42318}.empty{text-align:center;padding:35px;color:#687386}.modal-bg{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px;z-index:10}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;padding:22px}.modal-head{display:flex;justify-content:space-between}.x{border:0;border-radius:50%;width:32px;height:32px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.wide{grid-column:1/-1}@media(max-width:800px){.side{width:70px}.brand span,.nav span,.logout span{display:none}.main{margin-left:70px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.main{padding:13px}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body>
<div id="login" class="login"><div class="card login-card"><img class="logo" src="https://rbsrpakabudget.github.io/bhuvia-website/bhuvia-logo.jpg"><h1>Bhuvia Admin</h1><p class="muted">Secure Supabase Admin Panel</p><label>Supabase Project URL</label><input id="url" value="https://ptbpbalmlmhqsnjsnjmlc.supabase.co"><label>Supabase Anon/Public Key</label><input id="key" type="password" placeholder="Paste anon/public key"><button class="secondary" style="margin-top:8px" onclick="saveConfig()">Save Connection</button><label>Admin Email</label><input id="email" value="apkabudget@gmail.com"><label>Password</label><input id="pass" type="password"><button class="primary full" onclick="login()">Login</button><div id="msg" class="small" style="margin-top:10px"></div></div></div>
<div id="app" class="app" style="display:none"><aside class="side"><div class="brand"><img src="https://rbsrpakabudget.github.io/bhuvia-website/bhuvia-logo.jpg"><span>Bhuvia Admin</span></div><div class="nav"><button class="active" onclick="page('dashboard',this)">📊 <span>Dashboard</span></button><button onclick="page('orders',this)">🛒 <span>Orders</span></button><button onclick="page('products',this)">📦 <span>Products</span></button><button onclick="page('customers',this)">👥 <span>Customers</span></button><button onclick="page('coupons',this)">🏷️ <span>Coupons</span></button><button onclick="page('banners',this)">🖼️ <span>Banners</span></button></div><button class="secondary logout" onclick="logout()">↪ <span>Logout</span></button></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div class="muted small">Bhuvia — Everything Under Your Budget</div></div><div><span id="who" class="small muted"></span><button class="secondary" onclick="refresh()">↻ Refresh</button></div></div><div id="content"></div></main></div>
<div id="modal" class="modal-bg" style="display:none"><div class="card modal"><div class="modal-head"><h2 id="mtitle"></h2><button class="x" onclick="closeModal()">×</button></div><div id="mbody"></div></div></div>
<script>
const K='bhuviaSupabaseConfig';let sb=null,current='dashboard',orders=[];
function cfg(){try{return JSON.parse(localStorage.getItem(K)||'{}')}catch{return{}}}function sbUrl(){return (cfg().url||'').replace(/\/$/,'')} function init(){let c=cfg();if(c.url&&c.key)sb=supabase.createClient(c.url,c.key)}function saveConfig(){localStorage.setItem(K,JSON.stringify({url:url.value.trim(),key:key.value.trim()}));init();note('Connection saved','success')}function note(t,c=''){msg.textContent=t;msg.className='small '+c}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function money(x){return '₹'+Number(x||0).toLocaleString('en-IN',{maximumFractionDigits:2})}function badge(x){let c=x==='Pending'?'orange':x==='Cancelled'?'red':'';return '<span class="badge '+c+'">'+esc(x)+'</span>'}
async function login(){try{init();if(!sb)return note('First save the Supabase connection','error');note('Checking Supabase connection...');let h=await fetch(sbUrl()+'/auth/v1/health',{method:'GET'});if(!h.ok)return note('Supabase endpoint returned HTTP '+h.status,'error');note('Signing in...');let r=await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(r.error)return note(r.error.message,'error');let p=await sb.from('admin_profiles').select('*').eq('id',r.data.user.id).eq('is_active',true).maybeSingle();if(p.error||!p.data||!['admin','manager'].includes(p.data.role)){await sb.auth.signOut();return note('This user is not an active Bhuvia admin','error')}login.style.display='none';app.style.display='block';who.textContent=r.data.user.email;page('dashboard',document.querySelector('.nav button'))}catch(e){note('Connection error: '+(e&&e.message?e.message:String(e)),'error')}}
async function logout(){if(sb)await sb.auth.signOut();app.style.display='none';login.style.display='grid';pass.value=''}function refresh(){page(current,document.querySelector('.nav button.active'))}
function page(p,b){current=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');title.textContent=p[0].toUpperCase()+p.slice(1);({dashboard:dashboard,orders:loadOrders,products:loadProducts,customers:loadCustomers,coupons:loadCoupons,banners:loadBanners}[p]||dashboard)()}
async function dashboard(){let [o,p,c]=await Promise.all([sb.from('orders').select('id,grand_total,order_status,created_at'),sb.from('products').select('id,is_active'),sb.from('customers').select('id')]);if(o.error)return content.innerHTML='<div class="card panel error">'+esc(o.error.message)+'</div>';let a=o.data||[],sales=a.filter(x=>x.order_status!=='Cancelled').reduce((s,x)=>s+Number(x.grand_total||0),0);content.innerHTML='<div class="grid"><div class="card stat"><div class="muted">Total Orders</div><div class="num">'+a.length+'</div></div><div class="card stat"><div class="muted">Total Sales</div><div class="num">'+money(sales)+'</div></div><div class="card stat"><div class="muted">Pending Orders</div><div class="num">'+a.filter(x=>x.order_status==='Pending').length+'</div></div><div class="card stat"><div class="muted">Products</div><div class="num">'+(p.data||[]).filter(x=>x.is_active).length+'</div></div></div><div class="card panel"><h2>Recent Orders</h2>'+(a.sort((x,y)=>new Date(y.created_at)-new Date(x.created_at)).slice(0,8).map(x=>'<p><b>'+esc(x.id.slice(0,8))+'</b> · '+money(x.grand_total)+' · '+badge(x.order_status)+'</p>').join('')||'<div class="empty">No orders yet.</div>')+'</div>'}
async function loadOrders(){let r=await sb.from('orders').select('*').order('created_at',{ascending:false});if(r.error)return content.innerHTML='<div class="card panel error">'+esc(r.error.message)+'</div>';orders=r.data||[];content.innerHTML='<div class="card panel"><div class="toolbar"><input id="os" placeholder="Search order/customer/mobile" oninput="filterOrders()"><select id="ost" onchange="filterOrders()"><option value="">All status</option>'+['Pending','Confirmed','Processing','Shipped','Out for Delivery','Delivered','Cancelled'].map(x=>'<option>'+x+'</option>').join('')+'</select></div><div id="ot"></div></div>';filterOrders()}
function filterOrders(){let s=(os.value||'').toLowerCase(),st=ost.value,a=orders.filter(x=>(!st||x.order_status===st)&&(!s||[x.order_number,x.customer_name,x.customer_mobile].join(' ').toLowerCase().includes(s)));ot.innerHTML=a.length?'<table><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th></th></tr>'+a.map(x=>'<tr><td><b>'+esc(x.order_number)+'</b><div class="small muted">'+new Date(x.created_at).toLocaleString('en-IN')+'</div></td><td>'+esc(x.customer_name)+'<br>'+esc(x.customer_mobile)+'</td><td>'+money(x.grand_total)+'</td><td>'+badge(x.order_status)+'</td><td><button class="secondary" onclick="viewOrder(\''+x.id+'\')">View</button></td></tr>').join('')+'</table>':'<div class="empty">No orders found.</div>'}
async function viewOrder(id){let o=orders.find(x=>x.id===id),r=await sb.from('order_items').select('*').eq('order_id',id);mtitle.textContent=o.order_number;mbody.innerHTML='<p><b>'+esc(o.customer_name)+'</b> · '+esc(o.customer_mobile)+'</p><p class="small">'+esc([o.house_flat,o.street_area,o.landmark,o.city,o.state,o.pincode].filter(Boolean).join(', '))+'</p><hr><h3>Items</h3>'+(r.data||[]).map(i=>'<p>'+esc(i.product_name)+' × '+i.quantity+' <b style="float:right">'+money(i.total_price)+'</b></p>').join('')+'<hr><b>Grand Total: '+money(o.grand_total)+'</b><label>Order Status</label><select id="newstatus">'+['Pending','Confirmed','Processing','Shipped','Out for Delivery','Delivered','Cancelled'].map(x=>'<option '+(x===o.order_status?'selected':'')+'>'+x+'</option>').join('')+'</select><button class="primary full" onclick="updateOrder(\''+id+'\')">Update Status</button>';modal.style.display='grid'}async function updateOrder(id){let r=await sb.from('orders').update({order_status:newstatus.value}).eq('id',id);if(r.error)return alert(r.error.message);closeModal();loadOrders()}function closeModal(){modal.style.display='none'}
async function loadProducts(){let r=await sb.from('products').select('*').order('created_at',{ascending:false});if(r.error)return content.innerHTML='<div class="card panel error">'+esc(r.error.message)+'</div>';window.products=r.data||[];content.innerHTML='<div class="card panel"><div class="toolbar"><button class="primary" onclick="productForm()">+ Add Product</button></div><table><tr><th>Product</th><th>Price</th><th>Stock</th><th>Active</th><th></th></tr>'+products.map(x=>'<tr><td><b>'+esc(x.name)+'</b><div class="small muted">'+esc(x.category)+'</div></td><td>'+money(x.price)+'<br><span class="small muted">MRP '+money(x.mrp)+'</span></td><td>'+x.stock+'</td><td>'+badge(x.is_active?'Active':'Inactive')+'</td><td><button class="secondary" onclick="productForm(\''+x.id+'\')">Edit</button></td></tr>').join('')+'</table></div>'}
function productForm(id){let p=id?products.find(x=>x.id===id):{name:'',slug:'',category:'Water Purifier',price:0,mrp:0,stock:0,image_url:'',short_description:'',description:'',is_active:true};mtitle.textContent=id?'Edit Product':'Add Product';mbody.innerHTML='<div class="formgrid"><label>Product Name<input id="pn" value="'+esc(p.name)+'"></label><label>Slug<input id="ps" value="'+esc(p.slug)+'"></label><label>Category<input id="pc" value="'+esc(p.category)+'"></label><label>Price<input id="pp" type="number" value="'+p.price+'"></label><label>MRP<input id="pm" type="number" value="'+p.mrp+'"></label><label>Stock<input id="pst" type="number" value="'+p.stock+'"></label><label class="wide">Image URL<input id="pi" value="'+esc(p.image_url||'')+'"></label><label class="wide">Short Description<input id="psd" value="'+esc(p.short_description||'')+'"></label><label class="wide">Description<textarea id="pd">'+esc(p.description||'')+'</textarea></label><label><input id="pa" type="checkbox" '+(p.is_active?'checked':'')+' style="width:auto"> Active</label></div><button class="primary full" onclick="saveProduct(\''+(id||'')+'\')">Save Product</button>';modal.style.display='grid'}async function saveProduct(id){let o={name:pn.value.trim(),slug:ps.value.trim(),category:pc.value.trim(),price:Number(pp.value),mrp:Number(pm.value),stock:Number(pst.value),image_url:pi.value.trim(),short_description:psd.value.trim(),description:pd.value,is_active:pa.checked};let r=id?await sb.from('products').update(o).eq('id',id):await sb.from('products').insert(o);if(r.error)return alert(r.error.message);closeModal();loadProducts()}
async function loadCustomers(){let r=await sb.from('customers').select('*').order('created_at',{ascending:false});if(r.error)return content.innerHTML='<div class="card panel error">'+esc(r.error.message)+'</div>';content.innerHTML='<div class="card panel"><table><tr><th>Customer</th><th>Mobile</th><th>Location</th><th>Orders</th><th>Spent</th></tr>'+(r.data||[]).map(x=>'<tr><td><b>'+esc(x.full_name)+'</b><br><span class="small muted">'+esc(x.email||'')+'</span></td><td>'+esc(x.mobile)+'</td><td>'+esc([x.city,x.state,x.pincode].filter(Boolean).join(', '))+'</td><td>'+x.total_orders+'</td><td>'+money(x.total_spent)+'</td></tr>').join('')+'</table></div>'}
async function loadCoupons(){let r=await sb.from('coupons').select('*').order('created_at',{ascending:false});if(r.error)return content.innerHTML='<div class="card panel error">'+esc(r.error.message)+'</div>';content.innerHTML='<div class="card panel"><div class="toolbar"><button class="primary" onclick="couponForm()">+ Add Coupon</button></div><table><tr><th>Code</th><th>Discount</th><th>Minimum</th><th>Usage</th><th>Active</th></tr>'+(r.data||[]).map(x=>'<tr><td><b>'+esc(x.code)+'</b></td><td>'+esc(x.discount_type==='percentage'?x.discount_value+'%':money(x.discount_value))+'</td><td>'+money(x.minimum_order)+'</td><td>'+x.used_count+(x.usage_limit?' / '+x.usage_limit:'')+'</td><td>'+badge(x.is_active?'Active':'Inactive')+'</td></tr>').join('')+'</table></div>'}function couponForm(){mtitle.textContent='Add Coupon';mbody.innerHTML='<label>Code<input id="cc"></label><label>Type<select id="ct"><option value="percentage">Percentage</option><option value="fixed">Fixed</option></select></label><label>Discount Value<input id="cv" type="number"></label><label>Minimum Order<input id="cm" type="number" value="0"></label><button class="primary full" onclick="saveCoupon()">Save Coupon</button>';modal.style.display='grid'}async function saveCoupon(){let r=await sb.from('coupons').insert({code:cc.value.trim().toUpperCase(),discount_type:ct.value,discount_value:Number(cv.value),minimum_order:Number(cm.value),is_active:true});if(r.error)return alert(r.error.message);closeModal();loadCoupons()}
async function loadBanners(){let r=await sb.from('banners').select('*').order('sort_order',{ascending:true});if(r.error)return content.innerHTML='<div class="card panel error">'+esc(r.error.message)+'</div>';content.innerHTML='<div class="card panel"><div class="toolbar"><button class="primary" onclick="bannerForm()">+ Add Banner</button></div><table><tr><th>Title</th><th>Image</th><th>Order</th><th>Active</th></tr>'+(r.data||[]).map(x=>'<tr><td><b>'+esc(x.title)+'</b><br><span class="small muted">'+esc(x.subtitle||'')+'</span></td><td>'+esc(x.image_url||'—')+'</td><td>'+x.sort_order+'</td><td>'+badge(x.is_active?'Active':'Inactive')+'</td></tr>').join('')+'</table></div>'}function bannerForm(){mtitle.textContent='Add Banner';mbody.innerHTML='<label>Title<input id="bt"></label><label>Subtitle<input id="bs"></label><label>Image URL<input id="bi"></label><label>Button Text<input id="bb" value="Shop Now"></label><label>Button Link<input id="bl" value="#"></label><label>Sort Order<input id="bo" type="number" value="1"></label><button class="primary full" onclick="saveBanner()">Save Banner</button>';modal.style.display='grid'}async function saveBanner(){let r=await sb.from('banners').insert({title:bt.value.trim(),subtitle:bs.value.trim(),image_url:bi.value.trim(),button_text:bb.value.trim(),button_link:bl.value.trim(),sort_order:Number(bo.value),is_active:true});if(r.error)return alert(r.error.message);closeModal();loadBanners()}
init();
</script></body></html>
